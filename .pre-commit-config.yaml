# Git pre-commit hooks. Install once with `uv run pre-commit install`.
# Local hooks run the ruff and mypy pinned in uv.lock, so versions never drift
# from the ones the Claude Stop hook (.claude/hooks/check.sh) uses.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict)
        # Whole project, not only staged files: strict mode needs the full picture.
        entry: uv run mypy src tests
        language: system
        types_or: [python, pyi, toml]
        pass_filenames: false
